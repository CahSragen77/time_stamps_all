<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BS Timestamp - Pencatatan Broken Stock</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="css/style.css">
<script src="js/script.js" defer></script>
</head>
<body>
<div class="container">
    <h1>📦 BS Timestamp - Broken Stock</h1>

    <!-- KAMERA + OVERLAY INFO -->
        <div class="camera-box">
        <button type="button" class="btn green" id="btnKamera" 
                onclick="toggleKamera()" 
                style="position:absolute; top:10px; right:10px; z-index:10; padding:8px 14px; font-size:13px;">
            📷 Kamera ON
        </button>
        
        <video id="camera" autoplay playsinline></video>
        
        <div class="overlay-info">
            <div class="time" id="overlayTime">⏱️ --:--:--</div>
            <div class="loc" id="overlayLoc">📍 Mendapatkan lokasi...</div>
        </div>
    </div>

    
    <!-- FORM INPUT BS -->
<div class="card">
    <h3>📝 Data Broken Stock</h3>

        <!-- TOMBOL AKSI UTAMA (Scan Barcode & Ambil/Simpan Berdampingan) -->
    <div class="action-main-row">
        <button type="button" class="btn blue" onclick="bukaScanner()">📷 Scan Barcode</button>
        <button type="button" class="btn green" onclick="simpanBS()">📷 Ambil & Simpan</button>
    </div>

    <!-- AREA SCANNER (muncul saat tombol diklik) -->
    <div id="scannerBox" style="display:none; margin-bottom: 12px;">
        <div id="reader" style="width:100%; border-radius:8px; overflow:hidden;"></div>
        <button type="button" class="btn gray" onclick="tutupScanner()" style="width:100%; margin-top:6px;">
            ❌ Tutup Scanner
        </button>
    </div>

        <div class="form-group" style="position:relative;">
        <label>Nama Produk *</label>
        <input type="text" id="namaProduk" placeholder="Ketik nama produk atau barcode..." autocomplete="off">
        <div id="suggestBox" style="display:none; position:absolute; top:100%; left:0; right:0; background:#0f3460; border:1px solid #e94560; border-radius:6px; max-height:250px; overflow-y:auto; z-index:100;"></div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Jenis Barang *</label>
            <select id="jenisBarang">
                <option value="">-- Pilih --</option>
                <option value="Fresh">Fresh</option>
                <option value="Grocery">Grocery</option>
            </select>
        </div>
        <div class="form-group">
            <label>Kategori BS *</label>
            <select id="kategori">
                <option value="">-- Pilih --</option>
                <option>Rusak Fisik</option>
                <option>Expired</option>
                <option>Kemasan Bocor</option>
                <option>Kemasan Penyok</option>
                <option>Rasa Tidak Sesuai</option>
                <option>Lainnya</option>
            </select>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Berat (gram)</label>
            <input type="number" id="berat" step="1" min="0" placeholder="cth: 500">
        </div>
        <div class="form-group">
            <label>Qty PCS</label>
            <input type="number" id="qtyPcs" min="0" placeholder="0">
        </div>
        <div class="form-group">
            <label>Qty PACK</label>
            <input type="number" id="qtyPack" min="0" placeholder="0">
        </div>
    </div>

    <div class="form-group">
        <label>Catatan Tambahan</label>
        <textarea id="catatan" rows="2" placeholder="cth: Ditemukan di rak belakang, sudah lembek..."></textarea>
    </div>
</div>

    <!-- TOMBOL AKSI -->
    <div class="btn-row">
        <button class="btn blue" onclick="exportPDF()">📄 Cetak PDF</button>
        <button class="btn blue" onclick="exportExcel()">📊 Ekspor Excel</button>
        <button class="btn gray" onclick="hapusSemua()">🗑️ Hapus Semua</button>
    </div>

    <!-- HASIL FOTO TERAKHIR -->
    <div id="result"></div>

    <!-- RIWAYAT -->
    <div class="card" style="margin-top:15px;">
        <h3>📚 Riwayat BS (<span id="totalData">0</span> data)</h3>
        <div id="history"></div>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>


</body>
</html>
